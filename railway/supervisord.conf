[supervisord]
nodaemon=true
logfile_maxbytes=0
user=frappe

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:gunicorn]
command=/usr/local/bin/start.sh
priority=10
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopsignal=QUIT
stopasgroup=true
killasgroup=true

[program:socketio]
command=node apps/frappe/socketio.js
directory=/home/frappe/frappe-bench
priority=20
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopsignal=QUIT
stopasgroup=true
killasgroup=true

[program:scheduler]
command=bench schedule
directory=/home/frappe/frappe-bench
priority=30
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopsignal=QUIT
stopasgroup=true
killasgroup=true

[program:worker-short]
command=bench worker --queue short,default
directory=/home/frappe/frappe-bench
priority=40
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopsignal=QUIT
stopasgroup=true
killasgroup=true

[program:worker-long]
command=bench worker --queue long,default,short
directory=/home/frappe/frappe-bench
priority=50
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopsignal=QUIT
stopasgroup=true
killasgroup=true

[program:nginx]
command=/usr/local/bin/nginx-entrypoint.sh
priority=90
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopsignal=QUIT
stopasgroup=true
killasgroup=true

[program:backup]
command=/usr/local/bin/backup.sh
directory=/home/frappe/frappe-bench
priority=60
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopsignal=QUIT
stopasgroup=true
killasgroup=true
